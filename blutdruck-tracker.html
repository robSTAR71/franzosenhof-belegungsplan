<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blutdruck-Tracker – Robert & Edith</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            robert: { light: '#dbeafe', mid: '#3b82f6', dark: '#1d4ed8' },
            edith:  { light: '#fce7f3', mid: '#ec4899', dark: '#be185d' },
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; }
    .card { background: white; border-radius: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06); }
    .fade-in { animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
    .tab-btn { transition: all .15s; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; }
    .stat-badge { font-size:.72rem; font-weight:600; letter-spacing:.03em; padding:.2rem .55rem; border-radius:9999px; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-blue-50 pb-16">

<!-- ── Header ──────────────────────────────────────────────────── -->
<header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-slate-200 px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-400 to-pink-500 flex items-center justify-center text-white text-lg">❤️</div>
    <div>
      <h1 class="font-bold text-slate-800 text-lg leading-none">Blutdruck-Tracker</h1>
      <p class="text-slate-400 text-xs">Robert &amp; Edith</p>
    </div>
  </div>
  <button onclick="openForm()" class="flex items-center gap-2 bg-gradient-to-r from-blue-500 to-blue-600 text-white text-sm font-semibold px-4 py-2 rounded-xl shadow-sm hover:shadow-md active:scale-95 transition-all">
    <span class="text-base leading-none">+</span> Eintragen
  </button>
</header>

<!-- ── Person-Tabs ───────────────────────────────────────────── -->
<div class="max-w-2xl mx-auto px-4 pt-5">
  <div class="flex rounded-xl overflow-hidden border border-slate-200 bg-white/60 mb-5">
    <button id="tab-beide" onclick="setTab('beide')"
      class="tab-btn flex-1 py-2.5 text-sm font-semibold transition-all text-slate-500">
      Beide
    </button>
    <button id="tab-robert" onclick="setTab('robert')"
      class="tab-btn flex-1 py-2.5 text-sm font-semibold transition-all text-slate-500">
      Robert
    </button>
    <button id="tab-edith" onclick="setTab('edith')"
      class="tab-btn flex-1 py-2.5 text-sm font-semibold transition-all text-slate-500">
      Edith
    </button>
  </div>

  <!-- Stats row -->
  <div id="stats-row" class="grid grid-cols-3 gap-3 mb-5"></div>

  <!-- Chart -->
  <div id="chart-card" class="card p-4 mb-5">
    <div class="flex items-center justify-between mb-3">
      <span class="text-sm font-semibold text-slate-700">Verlauf (letzte 14 Einträge)</span>
      <div class="flex gap-1 text-xs">
        <span class="w-3 h-3 rounded-full bg-red-400 inline-block mt-0.5"></span><span class="text-slate-500 mr-2">Systolisch</span>
        <span class="w-3 h-3 rounded-full bg-blue-400 inline-block mt-0.5"></span><span class="text-slate-500 mr-2">Diastolisch</span>
        <span class="w-3 h-3 rounded-full bg-emerald-400 inline-block mt-0.5"></span><span class="text-slate-500">Puls</span>
      </div>
    </div>
    <canvas id="bpChart" height="160"></canvas>
    <p id="chart-empty" class="text-center text-slate-400 text-sm py-8 hidden">Noch keine Daten vorhanden</p>
  </div>

  <!-- Einträge -->
  <div id="entries-list" class="space-y-3"></div>
  <p id="list-empty" class="text-center text-slate-400 text-sm py-10 hidden">Noch keine Einträge vorhanden.<br>Tipp: Klicke auf „Eintragen".</p>
</div>

<!-- ── Modal: Eintrag erfassen ──────────────────────────────── -->
<div id="modal-overlay" onclick="closeForm()" class="hidden fixed inset-0 bg-black/40 z-50 backdrop-blur-sm"></div>
<div id="modal" class="hidden fixed bottom-0 left-0 right-0 z-50 bg-white rounded-t-2xl p-5 max-w-2xl mx-auto shadow-2xl">
  <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
  <h2 class="text-lg font-bold text-slate-800 mb-4">Messung eintragen</h2>

  <!-- Person -->
  <div class="mb-4">
    <label class="block text-xs font-semibold text-slate-500 mb-2">Person</label>
    <div class="grid grid-cols-2 gap-2">
      <button id="person-btn-robert" onclick="selectPerson('robert')"
        class="py-2.5 rounded-xl border-2 text-sm font-semibold transition-all border-blue-500 bg-blue-50 text-blue-700">
        Robert
      </button>
      <button id="person-btn-edith" onclick="selectPerson('edith')"
        class="py-2.5 rounded-xl border-2 text-sm font-semibold transition-all border-slate-200 text-slate-500">
        Edith
      </button>
    </div>
  </div>

  <!-- Datum & Uhrzeit -->
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1">Datum</label>
      <input id="inp-date" type="date" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1">Uhrzeit</label>
      <input id="inp-time" type="time" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
    </div>
  </div>

  <!-- Werte -->
  <div class="grid grid-cols-3 gap-3 mb-4">
    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1">Systolisch</label>
      <input id="inp-sys" type="number" min="60" max="260" placeholder="120"
        class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-400" />
      <span class="text-xs text-slate-400">mmHg</span>
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1">Diastolisch</label>
      <input id="inp-dia" type="number" min="40" max="160" placeholder="80"
        class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <span class="text-xs text-slate-400">mmHg</span>
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1">Puls</label>
      <input id="inp-pulse" type="number" min="30" max="220" placeholder="70"
        class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400" />
      <span class="text-xs text-slate-400">bpm</span>
    </div>
  </div>

  <!-- Notiz -->
  <div class="mb-5">
    <label class="block text-xs font-semibold text-slate-500 mb-1">Notiz (optional)</label>
    <input id="inp-note" type="text" placeholder="z.B. nach Sport, morgens nüchtern …"
      class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-300" />
  </div>

  <!-- Fehlertext -->
  <p id="form-error" class="text-red-500 text-sm mb-3 hidden"></p>

  <!-- Buttons -->
  <div class="flex gap-3">
    <button onclick="closeForm()" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50 transition-all">Abbrechen</button>
    <button onclick="saveEntry()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-blue-500 to-blue-600 text-white text-sm font-semibold shadow hover:shadow-md active:scale-95 transition-all">Speichern</button>
  </div>
</div>

<!-- ── Delete confirm ───────────────────────────────────────── -->
<div id="del-overlay" onclick="cancelDelete()" class="hidden fixed inset-0 bg-black/40 z-50 backdrop-blur-sm"></div>
<div id="del-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
    <p class="text-slate-700 font-semibold mb-1">Eintrag löschen?</p>
    <p class="text-slate-400 text-sm mb-5">Diese Aktion kann nicht rückgängig gemacht werden.</p>
    <div class="flex gap-3">
      <button onclick="cancelDelete()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-semibold">Abbrechen</button>
      <button onclick="confirmDelete()" class="flex-1 py-2.5 rounded-xl bg-red-500 text-white text-sm font-semibold">Löschen</button>
    </div>
  </div>
</div>

<script>
// ── Data ─────────────────────────────────────────────────────────
const STORAGE_KEY = 'blutdruck_entries_v1';
let entries = [];
let currentTab = 'beide';
let selectedPerson = 'robert';
let deleteId = null;
let chartInstance = null;
let editId = null;

function load() {
  try { entries = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { entries = []; }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

// ── BP Category ──────────────────────────────────────────────────
function bpCategory(sys, dia) {
  if (sys < 120 && dia < 80)  return { label: 'Optimal',        color: 'bg-emerald-100 text-emerald-700' };
  if (sys < 130 && dia < 85)  return { label: 'Normal',         color: 'bg-green-100 text-green-700' };
  if (sys < 140 && dia < 90)  return { label: 'Hoch-normal',    color: 'bg-yellow-100 text-yellow-700' };
  if (sys < 160 && dia < 100) return { label: 'Grad 1',         color: 'bg-orange-100 text-orange-700' };
  if (sys < 180 && dia < 110) return { label: 'Grad 2',         color: 'bg-red-100 text-red-700' };
  return                              { label: 'Grad 3',         color: 'bg-red-200 text-red-800' };
}

function personColor(p) {
  return p === 'robert'
    ? { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-700', dot: '#3b82f6' }
    : { bg: 'bg-pink-50',  border: 'border-pink-200',  text: 'text-pink-700',  dot: '#ec4899' };
}

// ── Tabs ─────────────────────────────────────────────────────────
function setTab(tab) {
  currentTab = tab;
  ['beide','robert','edith'].forEach(t => {
    const btn = document.getElementById('tab-' + t);
    if (t === tab) {
      btn.className = btn.className.replace(/text-slate-500/,'') + ' bg-white shadow text-slate-800';
    } else {
      btn.className = btn.className.replace(/ bg-white shadow text-slate-800/,'') + ' text-slate-500';
    }
  });
  render();
}

function filteredEntries() {
  if (currentTab === 'beide') return [...entries].sort((a,b)=>b.ts-a.ts);
  return entries.filter(e=>e.person===currentTab).sort((a,b)=>b.ts-a.ts);
}

// ── Stats ─────────────────────────────────────────────────────────
function renderStats() {
  const fe = filteredEntries();
  const el = document.getElementById('stats-row');
  if (!fe.length) { el.innerHTML=''; return; }

  const avgSys  = Math.round(fe.reduce((s,e)=>s+e.sys,0)/fe.length);
  const avgDia  = Math.round(fe.reduce((s,e)=>s+e.dia,0)/fe.length);
  const avgPulse= Math.round(fe.reduce((s,e)=>s+e.pulse,0)/fe.length);

  el.innerHTML = `
    <div class="card p-3 text-center">
      <div class="text-2xl font-bold text-red-500">${avgSys}</div>
      <div class="text-xs text-slate-400 mt-0.5">∅ Systolisch</div>
    </div>
    <div class="card p-3 text-center">
      <div class="text-2xl font-bold text-blue-500">${avgDia}</div>
      <div class="text-xs text-slate-400 mt-0.5">∅ Diastolisch</div>
    </div>
    <div class="card p-3 text-center">
      <div class="text-2xl font-bold text-emerald-500">${avgPulse}</div>
      <div class="text-xs text-slate-400 mt-0.5">∅ Puls</div>
    </div>`;
}

// ── Chart ─────────────────────────────────────────────────────────
function renderChart() {
  const fe = filteredEntries().slice(0,14).reverse();
  const canvas = document.getElementById('bpChart');
  const empty  = document.getElementById('chart-empty');

  if (!fe.length) {
    canvas.style.display='none'; empty.classList.remove('hidden'); return;
  }
  canvas.style.display=''; empty.classList.add('hidden');

  const labels = fe.map(e => {
    const d = new Date(e.ts);
    return d.toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit'}) + '\n' + d.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
  });

  if (chartInstance) { chartInstance.destroy(); chartInstance=null; }

  chartInstance = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label:'Systolisch', data: fe.map(e=>e.sys),   borderColor:'#f87171', backgroundColor:'#fef2f2', tension:.35, pointRadius:4, fill:false },
        { label:'Diastolisch',data: fe.map(e=>e.dia),   borderColor:'#60a5fa', backgroundColor:'#eff6ff', tension:.35, pointRadius:4, fill:false },
        { label:'Puls',       data: fe.map(e=>e.pulse), borderColor:'#34d399', backgroundColor:'#f0fdf4', tension:.35, pointRadius:4, fill:false },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{
        title: items => items[0].label.replace('\n',' ')
      }}},
      scales:{
        x:{ ticks:{ font:{size:10}, maxRotation:0 }, grid:{ display:false } },
        y:{ ticks:{ font:{size:10} }, grid:{ color:'#f1f5f9' } }
      }
    }
  });
}

// ── Entry List ────────────────────────────────────────────────────
function renderList() {
  const fe = filteredEntries();
  const cont  = document.getElementById('entries-list');
  const empty = document.getElementById('list-empty');

  if (!fe.length) { cont.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  cont.innerHTML = fe.map(e => {
    const cat = bpCategory(e.sys, e.dia);
    const col = personColor(e.person);
    const d   = new Date(e.ts);
    const dateStr = d.toLocaleDateString('de-AT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
    const timeStr = d.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
    return `
    <div class="card p-4 ${col.bg} border ${col.border} fade-in" id="entry-${e.id}">
      <div class="flex items-start justify-between gap-2">
        <div class="flex-1">
          <div class="flex items-center gap-2 mb-2 flex-wrap">
            <span class="stat-badge ${col.bg} ${col.text} border ${col.border}">${e.person==='robert'?'Robert':'Edith'}</span>
            <span class="stat-badge ${cat.color}">${cat.label}</span>
            <span class="text-xs text-slate-400">${dateStr} · ${timeStr}</span>
          </div>
          <div class="flex items-end gap-1">
            <span class="text-3xl font-bold text-slate-800">${e.sys}/${e.dia}</span>
            <span class="text-slate-400 text-sm pb-1">mmHg</span>
            <span class="ml-3 text-xl font-semibold text-emerald-600">${e.pulse}</span>
            <span class="text-slate-400 text-sm pb-0.5">bpm</span>
          </div>
          ${e.note ? `<p class="text-xs text-slate-500 mt-1.5 italic">${escHtml(e.note)}</p>` : ''}
        </div>
        <button onclick="askDelete('${e.id}')" class="text-slate-300 hover:text-red-400 transition-colors p-1 mt-0.5" title="Löschen">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  renderStats();
  renderChart();
  renderList();
}

// ── Form ──────────────────────────────────────────────────────────
function openForm() {
  const now = new Date();
  document.getElementById('inp-date').value = now.toISOString().slice(0,10);
  document.getElementById('inp-time').value = now.toTimeString().slice(0,5);
  document.getElementById('inp-sys').value   = '';
  document.getElementById('inp-dia').value   = '';
  document.getElementById('inp-pulse').value = '';
  document.getElementById('inp-note').value  = '';
  document.getElementById('form-error').classList.add('hidden');
  editId = null;
  selectPerson('robert');
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('inp-sys').focus(), 100);
}

function closeForm() {
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('modal').classList.add('hidden');
}

function selectPerson(p) {
  selectedPerson = p;
  ['robert','edith'].forEach(x => {
    const btn = document.getElementById('person-btn-' + x);
    if (x === p) {
      btn.className = btn.className
        .replace('border-slate-200 text-slate-500','')
        + (p==='robert' ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-pink-400 bg-pink-50 text-pink-700');
    } else {
      btn.className = 'py-2.5 rounded-xl border-2 text-sm font-semibold transition-all border-slate-200 text-slate-500';
    }
  });
}

function saveEntry() {
  const sys   = parseInt(document.getElementById('inp-sys').value);
  const dia   = parseInt(document.getElementById('inp-dia').value);
  const pulse = parseInt(document.getElementById('inp-pulse').value);
  const date  = document.getElementById('inp-date').value;
  const time  = document.getElementById('inp-time').value;
  const note  = document.getElementById('inp-note').value.trim();
  const errEl = document.getElementById('form-error');

  if (!date || !time)          { showErr('Bitte Datum und Uhrzeit angeben.'); return; }
  if (isNaN(sys)||sys<60||sys>260) { showErr('Systolischer Wert muss zwischen 60 und 260 liegen.'); return; }
  if (isNaN(dia)||dia<40||dia>160) { showErr('Diastolischer Wert muss zwischen 40 und 160 liegen.'); return; }
  if (isNaN(pulse)||pulse<30||pulse>220){ showErr('Puls muss zwischen 30 und 220 liegen.'); return; }
  if (sys <= dia)               { showErr('Systolischer Wert muss größer als diastolischer sein.'); return; }

  errEl.classList.add('hidden');
  const ts = new Date(date + 'T' + time).getTime();
  const entry = { id: Date.now().toString(36)+Math.random().toString(36).slice(2), person: selectedPerson, sys, dia, pulse, note, ts };
  entries.push(entry);
  save();
  closeForm();
  render();
}

function showErr(msg) {
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.classList.remove('hidden');
}

// ── Delete ────────────────────────────────────────────────────────
function askDelete(id) {
  deleteId = id;
  document.getElementById('del-overlay').classList.remove('hidden');
  document.getElementById('del-modal').classList.remove('hidden');
}
function cancelDelete() {
  deleteId = null;
  document.getElementById('del-overlay').classList.add('hidden');
  document.getElementById('del-modal').classList.add('hidden');
}
function confirmDelete() {
  entries = entries.filter(e=>e.id!==deleteId);
  save();
  cancelDelete();
  render();
}

// ── Init ──────────────────────────────────────────────────────────
window.addEventListener('keydown', e => { if(e.key==='Escape'){ closeForm(); cancelDelete(); } });
load();
setTab('beide');
</script>
</body>
</html>
